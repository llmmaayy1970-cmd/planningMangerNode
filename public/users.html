<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المستخدمين</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #21262d;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --primary:  #1f6feb;
      --success:  #3fb950;
      --danger:   #f85149;
      --warning:  #d29922;
      --radius:   8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    .header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .header-title { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .user-info { font-size: .85rem; color: var(--muted); }

    /* ── Layout ── */
    .container { max-width: 1000px; margin: 32px auto; padding: 0 24px; }
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .page-header h1 { font-size: 1.4rem; font-weight: 700; }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--surface2); padding: 12px 16px;
      text-align: right; font-size: .82rem; color: var(--muted);
      font-weight: 600; border-bottom: 1px solid var(--border);
    }
    td {
      padding: 13px 16px; border-bottom: 1px solid var(--border);
      font-size: .9rem; vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    .empty-row { text-align: center; color: var(--muted); padding: 40px !important; }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: .78rem; font-weight: 600;
    }
    .badge-admin { background: #f8514922; color: #f85149; border: 1px solid #f8514944; }
    .badge-user  { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb44; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 16px; border-radius: var(--radius); border: none;
      cursor: pointer; font-family: 'Tajawal', sans-serif;
      font-size: .88rem; font-weight: 600; transition: .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #388bfd; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-ghost   { background: none; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: #58a6ff; }
    .btn-sm { padding: 5px 11px; font-size: .8rem; }
    .btn-back { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-back:hover { border-color: #58a6ff; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px); z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; width: 100%; max-width: 460px;
      padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: .85rem; color: var(--muted); }
    .form-group input,
    .form-group select {
      width: 100%; padding: 9px 13px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Tajawal', sans-serif; font-size: .9rem; outline: none;
      transition: .15s;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #1f6feb22; }
    .form-hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 11px 24px; border-radius: 40px; font-size: .88rem;
      border: 1px solid; z-index: 999; display: none; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
    .toast.success { background: #0d1117; border-color: var(--success); color: var(--success); display: block; }
    .toast.error   { background: #0d1117; border-color: var(--danger);  color: var(--danger);  display: block; }

    /* ── Delete confirm ── */
    .confirm-box {
      background: var(--surface2); border: 1px solid var(--danger);
      border-radius: var(--radius); padding: 16px; margin-top: 8px;
      display: none;
    }
    .confirm-box.show { display: block; }
    .confirm-text { font-size: .88rem; margin-bottom: 12px; }
    .confirm-actions { display: flex; gap: 8px; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-title">👥 إدارة المستخدمين</div>
  <div class="header-actions">
    <span class="user-info" id="headerUser"></span>
    <button class="btn btn-back" onclick="goBack()">← العودة للتطبيق</button>
    <button class="btn btn-ghost btn-sm" onclick="logout()">⏻ خروج</button>
  </div>
</div>

<!-- المحتوى -->
<div class="container">
  <div class="page-header">
    <h1>المستخدمون المسجّلون</h1>
    <button class="btn btn-primary" onclick="openAdd()">+ إضافة مستخدم</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>اسم المستخدم</th>
          <th>الاسم الكامل</th>
          <th>الصلاحية</th>
          <th>تاريخ الإنشاء</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="usersBody">
        <tr><td colspan="6" class="empty-row">جارٍ التحميل...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- مودال الإضافة / التعديل -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">إضافة مستخدم جديد</div>
    <input type="hidden" id="editId">

    <div class="form-group">
      <label>اسم المستخدم (للدخول)</label>
      <input type="text" id="fUsername" placeholder="مثال: ahmed">
      <div class="form-hint" id="usernameHint"></div>
    </div>
    <div class="form-group">
      <label>الاسم الكامل</label>
      <input type="text" id="fFullname" placeholder="مثال: أحمد محمد">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="fPassword" placeholder="أدخل كلمة المرور">
      <div class="form-hint" id="pwdHint"></div>
    </div>
    <div class="form-group">
      <label>الصلاحية</label>
      <select id="fStatus">
        <option value="User">مستخدم عادي</option>
        <option value="Admin">مدير</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveUser()">💾 حفظ</button>
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = '/api/auth';
  let token = localStorage.getItem('pm_token');
  let currentUser = JSON.parse(localStorage.getItem('pm_user') || '{}');

  // التحقق من الصلاحية
  if (!token || currentUser.status !== 'Admin') {
    window.location.href = '/';
  }

  document.getElementById('headerUser').textContent = currentUser.full_name || '';

  // ── تحميل المستخدمين ──────────────────────────
  async function loadUsers() {
    const res = await apiFetch('GET', '/users');
    const tbody = document.getElementById('usersBody');
    if (!res.success || !res.data.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-row">لا يوجد مستخدمون</td></tr>';
      return;
    }
    tbody.innerHTML = res.data.map((u, i) => `
      <tr id="row_${u.id}">
        <td style="color:var(--muted)">${i + 1}</td>
        <td><strong>${esc(u.username)}</strong></td>
        <td>${esc(u.full_name || '-')}</td>
        <td><span class="badge ${u.status === 'Admin' ? 'badge-admin' : 'badge-user'}">
          ${u.status === 'Admin' ? '🔑 مدير' : '👤 مستخدم'}
        </span></td>
        <td style="color:var(--muted);font-size:.82rem">
          ${u.created_at ? new Date(u.created_at).toLocaleDateString('ar-IQ') : '-'}
        </td>
        <td>
          <button class="btn btn-ghost btn-sm" onclick="openEdit(${u.id},'${esc(u.username)}','${esc(u.full_name||'')}','${u.status}')">
            ✏️ تعديل
          </button>
          <button class="btn btn-danger btn-sm" style="margin-right:6px" onclick="confirmDelete(${u.id}, '${esc(u.username)}')">
            🗑 حذف
          </button>
        </td>
      </tr>
      <tr id="confirm_${u.id}">
        <td colspan="6" style="padding:0 16px 12px">
          <div class="confirm-box" id="confirmBox_${u.id}">
            <div class="confirm-text">⚠️ هل أنت متأكد من حذف المستخدم <strong>${esc(u.username)}</strong>؟</div>
            <div class="confirm-actions">
              <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">نعم، احذف</button>
              <button class="btn btn-ghost btn-sm" onclick="cancelDelete(${u.id})">إلغاء</button>
            </div>
          </div>
        </td>
      </tr>
    `).join('');
  }

  // ── فتح مودال الإضافة ──────────────────────────
  function openAdd() {
    document.getElementById('editId').value    = '';
    document.getElementById('fUsername').value = '';
    document.getElementById('fFullname').value = '';
    document.getElementById('fPassword').value = '';
    document.getElementById('fStatus').value   = 'User';
    document.getElementById('modalTitle').textContent = 'إضافة مستخدم جديد';
    document.getElementById('fUsername').readOnly = false;
    document.getElementById('usernameHint').textContent = '';
    document.getElementById('pwdHint').textContent = '';
    document.getElementById('modalOverlay').classList.remove('hidden');
  }

  // ── فتح مودال التعديل ──────────────────────────
  function openEdit(id, username, fullname, status) {
    document.getElementById('editId').value    = id;
    document.getElementById('fUsername').value = username;
    document.getElementById('fFullname').value = fullname;
    document.getElementById('fPassword').value = '';
    document.getElementById('fStatus').value   = status;
    document.getElementById('modalTitle').textContent = 'تعديل مستخدم';
    document.getElementById('fUsername').readOnly = true;
    document.getElementById('usernameHint').textContent = '';
    document.getElementById('pwdHint').textContent = 'اتركها فارغة للإبقاء على كلمة المرور الحالية';
    document.getElementById('modalOverlay').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.add('hidden');
  }

  // ── حفظ (إضافة أو تعديل) ──────────────────────
  async function saveUser() {
    const id       = document.getElementById('editId').value;
    const username = document.getElementById('fUsername').value.trim();
    const fullname = document.getElementById('fFullname').value.trim();
    const password = document.getElementById('fPassword').value;
    const status   = document.getElementById('fStatus').value;

    if (!username) { showToast('اسم المستخدم مطلوب', 'error'); return; }
    if (!id && !password) { showToast('كلمة المرور مطلوبة', 'error'); return; }

    const body = { username, full_name: fullname, status };
    if (password) body.password = password;

    const res = id
      ? await apiFetch('PUT', `/users/${id}`, body)
      : await apiFetch('POST', '/users', body);

    if (res.success) {
      showToast(res.message, 'success');
      closeModal();
      loadUsers();
    } else {
      showToast(res.message, 'error');
    }
  }

  // ── تأكيد الحذف ────────────────────────────────
  function confirmDelete(id, username) {
    // إغلاق أي تأكيد مفتوح آخر
    document.querySelectorAll('.confirm-box').forEach(b => b.classList.remove('show'));
    document.getElementById(`confirmBox_${id}`).classList.add('show');
  }
  function cancelDelete(id) {
    document.getElementById(`confirmBox_${id}`).classList.remove('show');
  }

  async function deleteUser(id) {
    const res = await apiFetch('DELETE', `/users/${id}`);
    if (res.success) {
      showToast('تم حذف المستخدم', 'success');
      loadUsers();
    } else {
      showToast(res.message, 'error');
    }
  }

  // ── مساعدات ────────────────────────────────────
  async function apiFetch(method, endpoint, body = null) {
    try {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
      };
      if (body) opts.body = JSON.stringify(body);
      const res  = await fetch(API + endpoint, opts);
      return await res.json();
    } catch (err) {
      return { success: false, message: err.message };
    }
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  let toastTimer;
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  function goBack()  { window.location.href = '/'; }
  function logout()  { localStorage.clear(); window.location.href = '/'; }

  // إغلاق المودال بالنقر خارجه
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // تحميل عند بدء الصفحة
  loadUsers();
</script>
</body>
</html>
