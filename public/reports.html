        .filter-group label { font-size: .82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
        .filter-group input, .filter-group select { padding: 8px 12px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--font); font-size: .88rem; outline: none; transition: var(--transition); }

        .report-item { border-bottom: 1px solid var(--border); padding: 16px 20px; transition: var(--transition); }

        .report-item:hover { background: var(--surface2); }
        .report-item-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
        .report-item-title { font-weight: 700; font-size: 1rem; color: var(--text); }
        .report-item-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: .82rem; color: var(--text-muted); }
        .report-item-meta span { display: flex; align-items: center; gap: 4px; }
        .report-item-details { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: none; }

<script>
// =============================================
// المتغيرات العامة
// =============================================
const API_BASE = '/api';
let currentUser = null;
let allProjects = [];
let allUsers = [];
let reportData = [];

// =============================================
// دوال مساعدة API
// =============================================
const api = {
    token: localStorage.getItem('pm_token'),

    setToken(t) {
        this.token = t;
        if (t) localStorage.setItem('pm_token', t);
        else localStorage.removeItem('pm_token');
    },

    async request(method, endpoint, data = null) {
        const opts = {
            method,
            headers: {
                'Content-Type': 'application/json',
                ...(this.token ? { 'Authorization': 'Bearer ' + this.token } : {})
            }
        };
        if (data && method !== 'GET') opts.body = JSON.stringify(data);

        const res = await fetch(API_BASE + endpoint, opts);
        const json = await res.json();

        if (res.status === 403 && json.message?.includes('منتهية')) {
            this.setToken(null);
            window.location.href = '/';
        }
        return json;
    },

    get: (ep) => this.request('GET', ep),
    post: (ep, data) => this.request('POST', ep, data),

    login: (u, p) => api.post('/auth/login', { username: u, password: p }),
    getProjects: () => api.get('/projects'),
    getUsers: () => api.get('/auth/users'),
    getDescriptions: (pid) => api.get(`/projects/${pid}/descriptions`),
};

// =============================================
// دوال رئيسية
// =============================================
document.addEventListener('DOMContentLoaded', () => {
    // تاريخ اليوم
    document.getElementById('reportDate').textContent = new Date().toLocaleDateString('ar-IQ', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });

    // التحقق من تسجيل الدخول
    const saved = localStorage.getItem('pm_user');
    const token = localStorage.getItem('pm_token');

    if (saved && token) {
        try {
            currentUser = JSON.parse(saved);
            api.setToken(token);
            updateUserInfo();
            loadDataAndPopulateFilters();
        } catch (e) {
            window.location.href = '/';
        }
    } else {
        window.location.href = '/';
    }
});

// ---- تحديث معلومات المستخدم ----
function updateUserInfo() {
    if (currentUser) {
        document.getElementById('headerUserName').textContent = currentUser.full_name || 'مستخدم';
        document.getElementById('headerUserRole').textContent = currentUser.status === 'Admin' ? 'مدير النظام' : 'مستخدم';
    }
}

// ---- تعبئة فلاتر التقارير ----
function populateReportFilters() {
    console.log('🔄 جاري تعبئة الفلاتر...');

    // فلتر أسماء المشاريع
    const projectSelect = document.getElementById('reportFilterProjectName');
    if (projectSelect) {
        projectSelect.innerHTML = '<option value="">-- جميع المشاريع --</option>';
        allProjects.forEach(p => {
            if (p.project_name) {
                projectSelect.innerHTML += `<option value="${esc(p.project_name)}">${esc(p.project_name)}</option>`;
            }
        });
        console.log('✅ تم تعبئة فلتر المشاريع بـ ' + allProjects.length + ' مشروع');
    }

    // فلتر المكلفين
    const userSelect = document.getElementById('reportFilterAssignedUser');
    if (userSelect) {
        userSelect.innerHTML = '<option value="">-- جميع المكلفين --</option>';
        allUsers.forEach(u => {
            if (u.full_name) {
                userSelect.innerHTML += `<option value="${esc(u.full_name)}">${esc(u.full_name)}</option>`;
            }
        });
        console.log('✅ تم تعبئة فلتر المكلفين بـ ' + allUsers.length + ' مستخدم');
    }
}

// ---- تحميل البيانات وتعبئة الفلاتر ----
async function loadDataAndPopulateFilters() {
    try {
        console.log('⏳ جاري تحميل البيانات...');
        const [projectsRes, usersRes] = await Promise.all([
            api.getProjects(),
            api.getUsers()
        ]);

        if (projectsRes.success) {
            allProjects = projectsRes.data || [];
            console.log('✅ تم تحميل ' + allProjects.length + ' مشروع');
        }

        if (usersRes.success) {
            allUsers = usersRes.data || [];
            console.log('✅ تم تحميل ' + allUsers.length + ' مستخدم');
        }

        populateReportFilters();

    } catch (err) {
        console.error('❌ خطأ:', err);
        showToast('خطأ في تحميل البيانات', 'error');
    }
}

// ---- تسجيل الخروج ----
function handleLogout() {
    api.setToken(null);
    localStorage.removeItem('pm_user');
    window.location.href = '/';
}

        let notesText = '';
        if (descs.length) {
            notesText = descs.map(d =>

        } else {
            notesText = '<span style="color:#999;font-size:11px;">لا توجد ملاحظات</span>';
        }

        let period = '-';
        if (p.start_date && p.completion_date) {
            const start = new Date(p.start_date);
            const end = new Date(p.completion_date);
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            period = `${diffDays} يوم`;
        } else if (p.duration_months) {
            period = `${p.duration_months} شهر`;
        }

        html += `

                    </tbody>

                تم إنشاء هذا التقرير بواسطة نظام المتابعة المركزية - عدد المشاريع: ${projects.length}
            </div>

    return html;
}

// ---- مساعدات ----
function statusBadge(st) {
    const map = { 'جديد': 'badge-new', 'مستمر': 'badge-ongoing', 'متوقف': 'badge-stopped', 'منجز': 'badge-done' };
    return `<span class="badge ${map[st] || ''}">${st}</span>`;
}

function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let toastTimer;

function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.add('hidden'); }, 3500);
}

function printReport() {
